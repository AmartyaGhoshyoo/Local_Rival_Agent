<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Executor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans antialiased p-8">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-blue-400">🚀 AI Agent Executor</h1>

        <div class="flex space-x-4 mb-6">
            <button id="tab-direct" onclick="switchTab('direct')" class="px-6 py-2 bg-blue-600 rounded-lg font-semibold hover:bg-blue-500 transition">Direct Code</button>
            <button id="tab-files" onclick="switchTab('files')" class="px-6 py-2 bg-gray-700 rounded-lg font-semibold hover:bg-gray-600 transition">Multiple Files</button>
        </div>

        <div id="section-direct" class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 mb-6 block">
            <h2 class="text-xl font-semibold mb-4">Direct Code Input</h2>
            <textarea id="direct-code" rows="10" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-4 font-mono text-sm text-green-400 focus:outline-none focus:border-blue-500" placeholder="# Paste your Python code here..."></textarea>
            <button onclick="executeDirect()" class="mt-4 px-6 py-2 bg-green-600 rounded-lg font-semibold hover:bg-green-500 transition w-full">Run Agent</button>
        </div>

        <div id="section-files" class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 mb-6 hidden">
            <h2 class="text-xl font-semibold mb-4">Upload Multiple Files</h2>
            <input type="file" id="file-upload" multiple accept=".py,.txt" class="block w-full text-sm text-gray-400
                file:mr-4 file:py-2 file:px-4
                file:rounded-lg file:border-0
                file:text-sm file:font-semibold
                file:bg-blue-600 file:text-white
                hover:file:bg-blue-500 mb-4 cursor-pointer" />
            <button onclick="executeFiles()" class="px-6 py-2 bg-green-600 rounded-lg font-semibold hover:bg-green-500 transition w-full">Run Selected Files</button>
        </div>

        <div class="bg-black p-6 rounded-xl shadow-lg border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-300">Execution Status</h2>
                <button onclick="clearLogs()" class="text-xs text-red-400 hover:text-red-300">Clear Logs</button>
            </div>
            <div id="log-container" class="h-64 overflow-y-auto font-mono text-sm space-y-2 text-gray-300 bg-gray-900 p-4 rounded border border-gray-800">
                <div>> Waiting for tasks...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/execute";

        // Tab Switching Logic
        function switchTab(tab) {
            document.getElementById('section-direct').classList.toggle('hidden', tab !== 'direct');
            document.getElementById('section-files').classList.toggle('hidden', tab !== 'files');
            
            document.getElementById('tab-direct').className = tab === 'direct' 
                ? "px-6 py-2 bg-blue-600 rounded-lg font-semibold transition" 
                : "px-6 py-2 bg-gray-700 rounded-lg font-semibold hover:bg-gray-600 transition";
                
            document.getElementById('tab-files').className = tab === 'files' 
                ? "px-6 py-2 bg-blue-600 rounded-lg font-semibold transition" 
                : "px-6 py-2 bg-gray-700 rounded-lg font-semibold hover:bg-gray-600 transition";
        }

        // Logging Function
        function addLog(message, type = "info") {
            const container = document.getElementById('log-container');
            const time = new Date().toLocaleTimeString();
            let color = "text-gray-300";
            if (type === "success") color = "text-green-400";
            if (type === "error") color = "text-red-400";
            if (type === "processing") color = "text-yellow-400";

            container.innerHTML += `<div class="${color}">[${time}] ${message}</div>`;
            container.scrollTop = container.scrollHeight; // Auto-scroll
        }

        function clearLogs() {
            document.getElementById('log-container').innerHTML = '<div>> Logs cleared. Waiting for tasks...</div>';
        }

        // Execute API Call
        async function runAgent(filename, code) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ filename, code })
                });

                const result = await response.json();

                if (response.ok) {
                    addLog(`✅ SUCCESS: ${filename} - ${result.message}`, "success");
                } else {
                    addLog(`❌ ERROR: ${filename} - ${result.detail.error}`, "error");
                }
            } catch (err) {
                addLog(`🚨 NETWORK ERROR: Failed to reach backend for ${filename}.`, "error");
            }
        }

        // Handle Direct Code Execution
        async function executeDirect() {
            const code = document.getElementById('direct-code').value.trim();
            if (!code) {
                alert("Please enter some code first.");
                return;
            }
            addLog(`⏳ Starting execution for: direct_input.py`, "processing");
            await runAgent("direct_input.py", code);
            addLog(`🏁 Finished direct execution workflow.`, "info");
        }

        // Handle File Reading (Promise wrapper)
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsText(file);
            });
        }

        // Handle Multiple Files Sequentially
        async function executeFiles() {
            const fileInput = document.getElementById('file-upload');
            const files = fileInput.files;

            if (files.length === 0) {
                alert("Please select at least one file.");
                return;
            }

            addLog(`📁 Found ${files.length} files. Starting sequential execution...`, "info");

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                addLog(`⏳ [${i + 1}/${files.length}] Processing: ${file.name}...`, "processing");
                
                try {
                    const code = await readFileAsText(file);
                    await runAgent(file.name, code);
                } catch (err) {
                    addLog(`❌ ERROR reading file ${file.name}`, "error");
                }
            }
            
            addLog(`🏁 All files processed!`, "success");
            fileInput.value = ""; // clear input
        }
    </script>
</body>
</html>
